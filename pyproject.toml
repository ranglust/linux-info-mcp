[project]
name = "linux-info-mcp"
version = "0.1.0"
description = "MCP server for read-only remote diagnostics over SSH"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ronen Angluster", email = "ronen.angluster@coinbase.com"},
]
dependencies = [
    "mcp",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
linux-info-mcp = "linux_info_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linux_info_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line-too-long (formatter handles it)
    "S101",   # assert (used everywhere in tests)
    "S603",   # subprocess-without-shell-equals-true (intentional in ssh.py)
    "S607",   # start-process-with-partial-path (ssh resolved via PATH on purpose)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S",      # security rules N/A in tests
    "B011",   # assert False (acceptable in tests)
]
